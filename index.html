    <!-- (the fonts the pond lays its words out in: fetch them right away) -->
    <link rel="preload" href="fonts/fjalla-one-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/lato-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/home.css" />

    <script type="importmap">
      {
        "imports": {
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js"
        }
      }
    </script>
    <!-- (three.webgpu.js imports three.core.js: fetch all three at once) -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js" crossorigin />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js" crossorigin />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js" crossorigin />
    <script type="module" src="js/voronoi.js"></script>
  </head>
  <body>
    <!-- The GPU renders every word below out of Voronoi cells. The DOM text
         stays in place (transparent) so links, selection and screen readers
         keep working, and it is what you see if WebGPU is unavailable. -->
    <canvas id="fx" aria-hidden="true"></canvas>

    <aside class="dev-menu" aria-label="Developer tools">
      <span class="dev-fps"><span id="dev-fps">–</span> fps</span>
      <label><input type="checkbox" id="dev-debug" /> Debug overlay</label>
      <a id="dev-fx" href="?nofx">Turn effects off</a>
    </aside>

    <div class="page">
      <header class="header">
        <a class="title" href="#">
          <h1 class="word-one" data-fx="title">Sam</h1>

            target="_blank"
            data-fx="nav"

      </header>

      <main class="content">
        <div class="main-links">
